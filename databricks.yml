# ============================================================================
# Databricks Asset Bundles - 통합 메타데이터 기반 파이프라인
# ============================================================================
# 이 DABs 설정은 unified_pipeline_metadata.yml을 기반으로
# 자동 생성된 리소스를 포함합니다.
#
# 사용법:
#   1. 메타데이터 처리:
#      python scripts/unified_metadata_processor.py \
#        --metadata-file metadata/unified_pipeline_metadata.yml \
#        --output-dir generated/ \
#        --environment dev
#
#   2. 배포:
#      databricks bundle deploy --target dev
#
#   3. 실행:
#      databricks bundle run orchestrator_item_goods_option_full --target dev
# ============================================================================

bundle:
  name: gmarket_meta_pipeline

sync:
  # generated 폴더, scripts, requirements.txt를 workspace에 동기화
  include:
    - "generated/**"
    - "scripts/**"
    - "requirements.txt"
  
include:
  # 자동 생성된 개별 dataflow DABs 포함
  - generated/dabs_*.yml

variables:
  # Unity Catalog
  catalog_name:
    description: "Unity Catalog name"
    default: "baikald1ws"
  
  # Secrets
  db_secrets_scope:
    description: "Databricks secrets scope for DB credentials"
    default: "pipeline-cred-baikalx"
  
  # SQL Warehouse ID
  warehouse_id:
    description: "SQL Warehouse ID for metadata operations"
    default: "4b9b953939869799"  # 실제 warehouse ID로 교체
  
  # Environment
  environment:
    description: "Deployment environment"
    default: "dev"

targets:
  dev:
    mode: development
    default: true
    variables:
      catalog_name: "baikald1ws"
      environment: "dev"
    workspace:
      host: "https://e2-demo-field-eng.cloud.databricks.com/"
  
  prod:
    mode: production
    variables:
      catalog_name: "baikald1ws"
      environment: "prod"
    workspace:
      host: "https://e2-demo-field-eng.cloud.databricks.com/"
    
    # Production 배포 시 승인 필요
    run_as:
      service_principal_name: "dlt-meta-prod-sp"

# 공통 리소스
resources:
  jobs:
    # 메타데이터 초기화 Job
    setup_metadata:
      name: "setup_metadata_tables"
      tasks:
        - task_key: create_metadata_schemas
          sql_task:
            file:
              path: ./generated/metadata_ddl_item_goods_option.sql
            warehouse_id: "${var.warehouse_id}"
      
      max_concurrent_runs: 1
      tags:
        project: "dlt-meta-unified"
        stage: "setup"
    
    # Mock 데이터 생성 Job (테스트용)
    create_mock_data:
      name: "create_mock_data"
      tasks:
        - task_key: generate_mock_data
          job_cluster_key: "mock_data_cluster"
          spark_python_task:
            python_file: ./scripts/create_mock_data.py
            parameters:
              - "--catalog"
              - "${var.catalog_name}"
              - "--days"
              - "7"
              - "--records-per-day"
              - "10"
      
      job_clusters:
        - job_cluster_key: "mock_data_cluster"
          new_cluster:
            spark_version: "17.3.x-scala2.13"
            node_type_id: "i3.xlarge"
            num_workers: 1  
      
      max_concurrent_runs: 1
      tags:
        project: "dlt-meta-unified"
        stage: "setup"
        purpose: "testing"
    
    # 전체 파이프라인 Orchestrator (실제 RDB 연동)
    orchestrator_full_pipeline:
      name: "orchestrator_item_goods_option_full"
      tasks:
        # Task 1: RDB Ingestion
        - task_key: rdb_ingestion
          job_cluster_key: "ingestion_cluster"
          notebook_task:
            notebook_path: ./notebooks/rdb_ingestion_runner.py
            base_parameters:
              config_file: "${workspace.root_path}/files/generated/rdb_ingestion_item_goods_option.json"
              environment: "${var.environment}"
              trigger_time: "{{job.start_time.iso_datetime}}"
        
        # Task 2: DLT Bronze/Silver Pipeline
        - task_key: dlt_bronze_silver
          depends_on:
            - task_key: rdb_ingestion
          pipeline_task:
            pipeline_id: "${resources.pipelines.dlt_item_goods_option.id}"
            full_refresh: false
        
        # Task 3: Data Quality Validation (Optional)
        - task_key: validate_data_quality
          depends_on:
            - task_key: dlt_bronze_silver
          job_cluster_key: "validation_cluster"
          notebook_task:
            notebook_path: ./notebooks/data_quality_validator.py
            base_parameters:
              dataflow_id: "item_goods_option"
              catalog: "${var.catalog_name}"
      
      job_clusters:
        - job_cluster_key: "ingestion_cluster"
          new_cluster:
            spark_version: "14.3.x-scala2.12"
            node_type_id: "i3.xlarge"
            num_workers: 2
            spark_conf:
              spark.databricks.delta.optimizeWrite.enabled: "true"
              spark.databricks.delta.autoCompact.enabled: "true"
        
        - job_cluster_key: "validation_cluster"
          new_cluster:
            spark_version: "14.3.x-scala2.12"
            node_type_id: "i3.xlarge"
            num_workers: 1
      
      # 스케줄 (환경별로 다르게 설정 가능)
      schedule:
        quartz_cron_expression: "0 0 2 * * ?"  # 매일 새벽 2시
        timezone_id: "Asia/Seoul"
        pause_status: "PAUSED"
      
      max_concurrent_runs: 1
      
      # email_notifications:
        # on_failure:
        #   - "lina.ryoo@databricks.com"
      
      tags:
        project: "dlt-meta-unified"
        dataflow_id: "item_goods_option"
        environment: "${var.environment}"
    
    # 테스트 파이프라인 Orchestrator (Mock 데이터 기반)
    test_pipeline_with_mock_data:
      name: "test_item_goods_option_with_mock_data"
      tasks:
        # Task 1: Mock 데이터 생성
        - task_key: generate_mock_data
          job_cluster_key: "test_cluster"
          spark_python_task:
            python_file: ./scripts/create_mock_data.py
            parameters:
              - "--catalog"
              - "${var.catalog_name}"
              - "--days"
              - "7"
              - "--records-per-day"
              - "10"
        
        # Task 2: DLT Bronze/Silver Pipeline 실행 (Full Refresh)
        - task_key: run_dlt_pipeline
          depends_on:
            - task_key: generate_mock_data
          pipeline_task:
            pipeline_id: "${resources.pipelines.dlt_item_goods_option.id}"
            full_refresh: true
        
        # Task 3: Data Quality Validation
        - task_key: validate_data_quality
          depends_on:
            - task_key: run_dlt_pipeline
          job_cluster_key: "test_cluster"
          notebook_task:
            notebook_path: ./notebooks/data_quality_validator.py
            base_parameters:
              dataflow_id: "item_goods_option"
              catalog: "${var.catalog_name}"
      
      job_clusters:
        - job_cluster_key: "test_cluster"
          new_cluster:
            spark_version: "17.3.x-scala2.13"
            node_type_id: "i3.xlarge"
            num_workers: 1
            spark_conf:
              spark.databricks.delta.optimizeWrite.enabled: "true"
              spark.databricks.delta.autoCompact.enabled: "true"
      
      max_concurrent_runs: 1
      
      tags:
        project: "dlt-meta-unified"
        dataflow_id: "item_goods_option"
        environment: "${var.environment}"
        purpose: "testing"

  # DLT Pipeline 리소스는 generated/dabs_*.yml에서 자동 생성됨
  # (위의 include 섹션 참조)

workspace:
  root_path: "/Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}"

permissions:
  # 현재 배포 사용자
  - user_name: lina.ryoo@databricks.com
    level: CAN_MANAGE
  
  # - level: CAN_MANAGE
  #   group_name: "data_platform_engineers"
  
  # - level: CAN_RUN
  #   service_principal_name: "123456-abcdef"
