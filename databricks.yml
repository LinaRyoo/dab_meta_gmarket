# ============================================================================
# Databricks Asset Bundles - 통합 메타데이터 기반 파이프라인
# ============================================================================
# 이 DABs 설정은 unified_pipeline_metadata.yml을 기반으로
# 자동 생성된 리소스를 포함합니다.
#
# 사용법:
#   1. 메타데이터 처리:
#      python scripts/unified_metadata_processor.py \
#        --metadata-file metadata/unified_pipeline_metadata.yml \
#        --output-dir generated/ \
#        --environment dev
#
#   2. 배포:
#      databricks bundle deploy --target dev
#
#   3. 실행:
#      databricks bundle run orchestrator_item_goods_option_full --target dev
# ============================================================================

bundle:
  name: gmarket_meta_pipeline

sync:
  # generated 폴더, scripts, requirements.txt를 workspace에 동기화
  include:
    - "generated/**"
    - "scripts/**"
    - "requirements.txt"
  
include:
  # 자동 생성된 개별 dataflow DABs 포함
  - generated/dabs_*.yml

variables:
  # Unity Catalog
  catalog_name:
    description: "Unity Catalog name"
    default: "baikald1ws"
  
  # Secrets
  db_secrets_scope:
    description: "Databricks secrets scope for DB credentials"
    default: "pipeline-cred-baikalx"
  
  # SQL Warehouse ID
  warehouse_id:
    description: "SQL Warehouse ID for metadata operations"
    default: "8a389507a5bf8eb6"  # 실제 warehouse ID로 교체
  
  # Environment
  environment:
    description: "Deployment environment"
    default: "dev"

targets:
  dev:
    mode: development
    default: true
    variables:
      catalog_name: "baikald1ws"
      environment: "dev"
    workspace:
      host: "https://adb-5971940266401983.3.azuredatabricks.net/"
  
  prod:
    mode: production
    variables:
      catalog_name: "baikald1ws"
      environment: "prod"
    workspace:
      host: "https://adb-5971940266401983.3.azuredatabricks.net/"
    
    # Production 배포 시 승인 필요
    run_as:
      service_principal_name: "dlt-meta-prod-sp"

# 공통 리소스
resources:
  jobs:
    # # 메타데이터 초기화 Job
    # serverless or pro 만 가능 --> 현재 classic 밖에 없으므로 수동으로 실행
    # setup_metadata:
    #   name: "setup_metadata_tables"
    #   tasks:
    #     - task_key: create_metadata_schemas
    #       sql_task:
    #         file:
    #           path: ./generated/metadata_ddl_item_goods_option.sql
    #         warehouse_id: "${var.warehouse_id}" # serverless or pro 만 가능
      
    #   max_concurrent_runs: 1
    #   tags:
    #     project: "dlt-meta-unified"
    #     stage: "setup"
    
    # Mock 데이터 생성 Job (테스트용)
    create_mock_data:
      name: "[${var.environment}] create_mock_data"
      tasks:
        - task_key: generate_mock_data
          job_cluster_key: "mock_data_cluster"
          spark_python_task:
            python_file: ./scripts/create_mock_data.py
            parameters:
              - "--catalog"
              - "${var.catalog_name}"
              - "--days"
              - "7"
              - "--records-per-day"
              - "10"
      
      job_clusters:
        - job_cluster_key: "mock_data_cluster"
          new_cluster:
            spark_version: "17.3.x-scala2.13"
            node_type_id: "Standard_D8ds_v5"
            num_workers: 1  
      
      max_concurrent_runs: 1
      tags:
        project: "dlt-meta-unified"
        stage: "setup"
        purpose: "testing"
    
    # Bad Data 추가 Job (Expectation 테스트용)
    append_bad_data:
      name: "[${var.environment}] append_bad_data"
      tasks:
        - task_key: append_bad_records
          job_cluster_key: "mock_data_cluster"
          spark_python_task:
            python_file: ./scripts/create_mock_data.py
            parameters:
              - "--catalog"
              - "${var.catalog_name}"
              - "--skip-metadata"
              - "--skip-raw-data"
              - "--append-bad-data"
              - "--bad-records"
              - "10"
      
      job_clusters:
        - job_cluster_key: "mock_data_cluster"
          new_cluster:
            spark_version: "17.3.x-scala2.13"
            node_type_id: "Standard_D8ds_v5"
            num_workers: 1
      
      max_concurrent_runs: 1
      tags:
        project: "dlt-meta-unified"
        stage: "testing"
        purpose: "data-quality-testing"
    
    # Mock Data + Bad Data 한번에 생성 Job
    create_mock_data_with_bad_records:
      name: "[${var.environment}] create_mock_data_with_bad_records"
      tasks:
        - task_key: generate_all_mock_data
          job_cluster_key: "mock_data_cluster"
          spark_python_task:
            python_file: ./scripts/create_mock_data.py
            parameters:
              - "--catalog"
              - "${var.catalog_name}"
              - "--days"
              - "7"
              - "--records-per-day"
              - "10"
              - "--append-bad-data"
              - "--bad-records"
              - "10"
      
      job_clusters:
        - job_cluster_key: "mock_data_cluster"
          new_cluster:
            spark_version: "17.3.x-scala2.13"
            node_type_id: "Standard_D8ds_v5"
            num_workers: 1
      
      max_concurrent_runs: 1
      tags:
        project: "dlt-meta-unified"
        stage: "testing"
        purpose: "full-testing-setup"
    
    # 전체 파이프라인 Orchestrator (실제 RDB 연동)
    orchestrator_full_pipeline:
      name: "orchestrator_item_goods_option_full"
      tasks:
        # Task 1: RDB Ingestion
        - task_key: rdb_ingestion
          job_cluster_key: "ingestion_cluster"
          notebook_task:
            notebook_path: ./notebooks/rdb_ingestion_runner.py
            base_parameters:
              config_file: "${workspace.root_path}/files/generated/rdb_ingestion_item_goods_option.json"
              environment: "${var.environment}"
              trigger_time: "{{job.start_time.iso_datetime}}"
        
        # Task 2: DLT Bronze/Silver Pipeline
        - task_key: dlt_bronze_silver
          depends_on:
            - task_key: rdb_ingestion
          pipeline_task:
            pipeline_id: "${resources.pipelines.dlt_item_goods_option.id}"
            full_refresh: false
        
        # Task 3: Data Quality Validation (Optional)
        - task_key: validate_data_quality
          depends_on:
            - task_key: dlt_bronze_silver
          job_cluster_key: "validation_cluster"
          notebook_task:
            notebook_path: ./notebooks/data_quality_validator.py
            base_parameters:
              dataflow_id: "item_goods_option"
              catalog: "${var.catalog_name}"
      
      job_clusters:
        - job_cluster_key: "ingestion_cluster"
          new_cluster:
            spark_version: "17.3.x-scala2.13"
            node_type_id: "Standard_D8ds_v5"
            num_workers: 1
            spark_conf:
              spark.databricks.delta.optimizeWrite.enabled: "true"
              spark.databricks.delta.autoCompact.enabled: "true"
        
        - job_cluster_key: "validation_cluster"
          new_cluster:
            spark_version: "17.3.x-scala2.13"
            node_type_id: "Standard_D8ds_v5"
            num_workers: 1
      
      # 스케줄 (환경별로 다르게 설정 가능)
      schedule:
        quartz_cron_expression: "0 0 2 * * ?"  # 매일 새벽 2시
        timezone_id: "Asia/Seoul"
        pause_status: "PAUSED"
      
      max_concurrent_runs: 1
      
      # email_notifications:
        # on_failure:
        #   - "lina.ryoo@databricks.com"
      
      tags:
        project: "dlt-meta-unified"
        dataflow_id: "item_goods_option"
        environment: "${var.environment}"
    
    # 테스트 파이프라인 Orchestrator (Mock 데이터 기반)
    test_pipeline_with_mock_data:
      name: "test_item_goods_option_with_mock_data"
      tasks:
        # Task 1: Mock 데이터 생성
        - task_key: generate_mock_data
          job_cluster_key: "test_cluster"
          spark_python_task:
            python_file: ./scripts/create_mock_data.py
            parameters:
              - "--catalog"
              - "${var.catalog_name}"
              - "--days"
              - "7"
              - "--records-per-day"
              - "10"
        
        # Task 2: DLT Bronze/Silver Pipeline 실행 (Full Refresh)
        - task_key: run_dlt_pipeline
          depends_on:
            - task_key: generate_mock_data
          pipeline_task:
            pipeline_id: "${resources.pipelines.dlt_item_goods_option.id}"
            full_refresh: true
        
        # Task 3: Data Quality Validation
        - task_key: validate_data_quality
          depends_on:
            - task_key: run_dlt_pipeline
          job_cluster_key: "test_cluster"
          notebook_task:
            notebook_path: ./notebooks/data_quality_validator.py
            base_parameters:
              dataflow_id: "item_goods_option"
              catalog: "${var.catalog_name}"
      
      job_clusters:
        - job_cluster_key: "test_cluster"
          new_cluster:
            spark_version: "17.3.x-scala2.13"
            node_type_id: "Standard_D8ds_v5"
            num_workers: 1
            spark_conf:
              spark.databricks.delta.optimizeWrite.enabled: "true"
              spark.databricks.delta.autoCompact.enabled: "true"
      
      max_concurrent_runs: 1
      
      tags:
        project: "dlt-meta-unified"
        dataflow_id: "item_goods_option"
        environment: "${var.environment}"
        purpose: "testing"

    # 모니터링 Job (주기적 실행)
    pipeline_monitoring:
      name: "[${bundle.target}] pipeline_monitoring"
      
      tasks:
        - task_key: monitor_pipelines
          job_cluster_key: "monitoring_cluster"
          notebook_task:
            notebook_path: ./notebooks/pipeline_monitor.py
            base_parameters:
              catalog: "${var.catalog_name}"
              monitoring_window_hours: "1"
              # Slack Webhook URL은 Databricks Secret으로 관리 권장
              # slack_webhook_url: "{{secrets/pipeline-cred-baikalx/slack_webhook}}"
              # email_recipients: "data-team@company.com,ops-team@company.com"
              alert_level: "all"
          libraries:
            - pypi:
                package: "requests"
      
      job_clusters:
        - job_cluster_key: "monitoring_cluster"
          new_cluster:
            spark_version: "17.3.x-scala2.13"
            node_type_id: "Standard_D8ds_v5"
            num_workers: 1
            spark_conf:
              spark.databricks.delta.preview.enabled: "true"
      
      # 1시간마다 실행
      schedule:
        quartz_cron_expression: "0 0 * * * ?"  # 매시간 정각
        timezone_id: "Asia/Seoul"
        pause_status: PAUSED
      
      max_concurrent_runs: 1
      
      # email_notifications:
      #   on_failure:
      #     - "lina.ryoo@databricks.com"
      
      tags:
        project: "dlt-meta-unified"
        environment: "${var.environment}"
        purpose: "monitoring"

  # DLT Pipeline 리소스는 generated/dabs_*.yml에서 자동 생성됨
  # (위의 include 섹션 참조)

workspace:
  root_path: "/Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}"

permissions:
  # 현재 배포 사용자
  - user_name: data2440@gepplus.net
    level: CAN_MANAGE
  - user_name: data2441@gepplus.net
    level: CAN_MANAGE
  - group_name: "users"
    level: CAN_MANAGE
